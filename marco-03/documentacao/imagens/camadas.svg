<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial" font-size="13"><rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect x="20" y="10" width="720" height="230" rx="16" fill="#F4F2EC" stroke="#D6D2C6"/>
  <text x="40" y="36" font-weight="700" fill="#13203A">1 · Canal cifrado (TLS) — ninguém lê no caminho</text>
  <rect x="50" y="48" width="660" height="182" rx="14" fill="#E8EDF5" stroke="#C3CDDD"/>
  <text x="70" y="74" font-weight="700" fill="#13203A">2 · Autenticação MQTT — só entra quem tem usuário e senha</text>
  <rect x="80" y="86" width="600" height="134" rx="12" fill="#D6E1F2" stroke="#9FB3D6"/>
  <text x="100" y="112" font-weight="700" fill="#13203A">3 · Identidade — cada mensagem assinada por quem a produziu</text>
  <rect x="110" y="124" width="540" height="86" rx="10" fill="#13203A"/>
  <text x="130" y="152" font-weight="700" fill="#F2A65A">4 · Prova de proximidade</text>
  <text x="130" y="174" fill="#F4F2EC">o token da âncora muda a cada 12 s; só a âncora e o servidor sabem gerá-lo</text>
  <text x="130" y="194" fill="#C9D2E3">heartbeat feito em casa não tem o token de agora</text>
</svg>