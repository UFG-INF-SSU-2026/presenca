  <rect x="10" y="20" width="200" height="170" rx="12" fill="#F4F2EC" stroke="#D6D2C6"/>
  <text x="110" y="44" text-anchor="middle" font-weight="700" fill="#13203A">Celular (produz)</text>
  <text x="25" y="70" fill="#2B3445">1. monta o heartbeat</text>
  <text x="25" y="92" fill="#2B3445">2. assina com a chave</text>
  <text x="40" y="110" fill="#5B6577">privada:</text>
  <text x="40" y="128" fill="#A1501A" font-family="Consolas">Ed25519(tópico+carga)</text>
  <text x="25" y="152" fill="#2B3445">3. publica o envelope</text>
  <rect x="270" y="45" width="220" height="120" rx="10" fill="#13203A"/>
  <text x="380" y="68" text-anchor="middle" fill="#F2A65A" font-family="Consolas">seguranca.envelope.v1</text>
  <text x="285" y="92" fill="#F4F2EC" font-family="Consolas">de: "tok-10ba682c"</text>
  <text x="285" y="110" fill="#F4F2EC" font-family="Consolas">chavePublica: d04a…8737</text>
  <text x="285" y="128" fill="#F4F2EC" font-family="Consolas">carga: "{…heartbeat…}"</text>
  <text x="285" y="146" fill="#8FC1FF" font-family="Consolas">assinatura: d102…a405</text>
  <rect x="550" y="20" width="200" height="170" rx="12" fill="#F4F2EC" stroke="#D6D2C6"/>
  <text x="650" y="44" text-anchor="middle" font-weight="700" fill="#13203A">Servidor (consome)</text>
  <text x="562" y="70" fill="#2B3445">1. assinatura confere?</text>
  <text x="562" y="92" fill="#2B3445">2. carga respeita o contrato?</text>
  <text x="562" y="114" fill="#2B3445">3. hash(chave) = aluno?</text>
  <text x="562" y="136" fill="#2B3445">4. token da âncora é de agora?</text>
  <text x="562" y="166" fill="#A1501A" font-weight="700">qualquer “não” → RECUSADA</text>
